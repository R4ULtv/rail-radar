name: Cloudflare Deployments

# Workers Builds deploys the code; this workflow only mirrors its check runs
# into the GitHub Deployments API so they show up under Environments.
on:
  check_run:
    types: [created, completed]

permissions:
  contents: read
  deployments: write

jobs:
  report:
    name: Report to GitHub Deployments
    if: github.event.check_run.app.slug == 'cloudflare-workers-and-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v9
        env:
          CF_WORKERS_SUBDOMAIN: r4ultv
        with:
          script: |
            const WORKERS = [
              { name: 'rail-radar-web', label: 'web', production: 'https://www.railradar24.com' },
              { name: 'rail-radar-api', label: 'api', production: 'https://api.railradar24.com' },
            ]

            const run = context.payload.check_run
            const branch = run.check_suite?.head_branch
            const sha = run.head_sha

            const haystack = [run.name, run.details_url, run.output?.title, run.output?.summary]
              .filter(Boolean)
              .join(' ')
              .toLowerCase()
            const worker = WORKERS.find((w) => haystack.includes(w.name))

            if (!worker || !branch) {
              core.notice(`Unrecognized Cloudflare check run: ${run.name}`)
              core.info(JSON.stringify({ name: run.name, details_url: run.details_url, output: run.output }, null, 2))
              return
            }

            const isProduction = branch === 'main'
            const environment = isProduction ? 'Production' : 'Preview'
            // Both Workers share an environment; `task` keeps their deployments distinct.
            const task = `deploy:${worker.label}`

            // Workers Builds names each branch preview after the branch:
            // <alias>-<worker-name>.<subdomain>.workers.dev
            const alias = branch
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .slice(0, 28)
              .replace(/(^-|-$)/g, '')
            const url = isProduction
              ? worker.production
              : `https://${alias}-${worker.name}.${process.env.CF_WORKERS_SUBDOMAIN}.workers.dev`

            const findDeployment = async () => {
              const { data } = await github.rest.repos.listDeployments({
                ...context.repo,
                sha,
                environment,
                task,
                per_page: 1,
              })
              return data[0]?.id
            }

            const createDeployment = async () => {
              const { data } = await github.rest.repos.createDeployment({
                ...context.repo,
                ref: sha,
                environment,
                task,
                description: `Cloudflare Workers Build — ${worker.name}`,
                auto_merge: false,
                required_contexts: [],
                production_environment: isProduction,
                transient_environment: !isProduction,
              })
              return data.id
            }

            if (run.status !== 'completed') {
              const deployment_id = (await findDeployment()) ?? (await createDeployment())
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id,
                state: 'in_progress',
                description: 'Building on Cloudflare…',
                log_url: run.details_url,
                environment_url: url,
              })
              return
            }

            const state = run.conclusion === 'success'
              ? 'success'
              : ['cancelled', 'skipped', 'neutral'].includes(run.conclusion)
                ? 'inactive'
                : 'failure'

            const deployment_id = (await findDeployment()) ?? (await createDeployment())
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id,
              state,
              description: `Cloudflare build ${run.conclusion}`,
              log_url: run.details_url,
              auto_inactive: true,
              ...(state === 'success' ? { environment_url: url } : {}),
            })
