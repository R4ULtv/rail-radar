name: CI

on:
  # Check main after merges or direct pushes; preview changes are checked through PRs.
  # Listening for preview pushes as well would run CI twice when its PR is open.
  push:
    branches: [main]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Turbo --affected needs history to select changed packages safely.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install once and run every check at the same time: formatting in the background beside
      # one Turbo run, which parallelises lint, types and tests and records each task's result.
      # This step only runs them; the steps below report and fail each check separately.
      - name: Run checks
        id: run
        run: |
          pnpm format:check > "$RUNNER_TEMP/format.log" 2>&1 &
          format_pid=$!
          pnpm exec turbo run lint check-types test \
            --affected --continue=always --summarize --output-logs=none || true
          format_status=0
          wait "$format_pid" || format_status=$?
          echo "format=$format_status" >> "$GITHUB_OUTPUT"

      - name: Format
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: |
          cat "$RUNNER_TEMP/format.log"
          exit ${{ steps.run.outputs.format }}

      - name: Lint
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: node .github/scripts/report-turbo-task.mts lint

      - name: Type Check
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: node .github/scripts/report-turbo-task.mts check-types

      - name: Test
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: node .github/scripts/report-turbo-task.mts test
