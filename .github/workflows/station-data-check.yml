name: Station Data Check

on:
  pull_request:
    branches: [main, preview]
    paths:
      - ".github/scripts/validate-stations*.ts"
      - ".github/workflows/station-data-check.yml"
      - "packages/data/src/types.ts"
      # The validator uses only Node built-ins; dependency updates do not affect it.
      - "packages/data/src/stations.geojson"

concurrency:
  # Only the latest run for a PR should spend time generating its station report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-report:
    name: Validate Station Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get base branch file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fetch only the event's base commit; the diff does not need full history.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:packages/data/src/stations.geojson" > /tmp/stations-base.geojson

      # Node 24 runs this dependency-free TypeScript validator without tsx or pnpm.
      - name: Run validation and diff
        id: validate
        run: |
          node .github/scripts/validate-stations.ts \
            --base=/tmp/stations-base.geojson \
            --head=packages/data/src/stations.geojson \
            --output=/tmp/report.md \
            --full-output=/tmp/station-data-report.md \
            --report-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish job summary
        run: cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full station report
        uses: actions/upload-artifact@v7
        with:
          name: station-data-report
          path: /tmp/station-data-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Find existing comment
        # Fork and Dependabot tokens cannot write PR comments; the summary and artifact still work.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- station-data-check -->"

      - name: Create or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/report.md
          edit-mode: replace

      - name: Fail if validation errors
        if: always() && steps.validate.outputs.has_errors == 'true'
        run: exit 1
