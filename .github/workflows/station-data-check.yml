name: Station Data Check

on:
  pull_request:
    branches: [main, preview]
    paths:
      - ".github/scripts/validate-stations.ts"
      - ".github/workflows/station-data-check.yml"
      # The validator uses only Node built-ins; dependency updates do not affect it.
      - "packages/data/src/stations.geojson"

concurrency:
  # Only the latest run for a PR should spend time generating its station report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-report:
    name: Validate Station Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get base branch file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fetch only the event's base commit; the diff does not need full history.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:packages/data/src/stations.geojson" > /tmp/stations-base.geojson

      # Node 24 runs this dependency-free TypeScript validator without tsx or pnpm.
      - name: Run validation and diff
        id: validate
        run: |
          node .github/scripts/validate-stations.ts \
            --base=/tmp/stations-base.geojson \
            --head=packages/data/src/stations.geojson \
            --output=/tmp/report.md

      - name: Read report
        id: report
        run: |
          delimiter="$(openssl rand -hex 32)"
          while grep -Fqx "$delimiter" /tmp/report.md; do
            delimiter="$(openssl rand -hex 32)"
          done
          {
            echo "report<<$delimiter"
            cat /tmp/report.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- station-data-check -->"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.report.outputs.report }}
          edit-mode: replace

      - name: Fail if validation errors
        if: steps.validate.outputs.has_errors == 'true'
        run: exit 1
